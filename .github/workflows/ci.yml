name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

  e2e:
    name: Playwright
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Salesforce auth secret
        id: auth
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          if [ -n "$SF_AUTH_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SF_AUTH_URL is not set. Skipping Playwright e2e. Compile already passed."
          fi

      - name: Install Playwright Chromium
        if: steps.auth.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.auth.outputs.available == 'true'
        env:
          SF_BASE_URL: ${{ secrets.SF_BASE_URL }}
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: npm test

      - name: Upload Playwright report
        if: steps.auth.outputs.available == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
